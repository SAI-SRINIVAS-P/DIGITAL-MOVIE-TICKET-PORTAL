name: digital-movie-ticket-portal
services:
  mysql:
    image: mysql:8.4
    command: ["--default-time-zone=+05:30"]
    environment:
      TZ: Asia/Kolkata
      MYSQL_DATABASE: movie_portal
      MYSQL_USER: movie_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-movie_app_dev_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 20s

  backend:
    build: ./backend
    environment:
      TZ: Asia/Kolkata
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/movie_portal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: movie_app
      DB_PASSWORD: ${DB_PASSWORD:-movie_app_dev_only}
      JWT_SECRET: ${JWT_SECRET:-bXktZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1mb3ItbW92aWUtcG9ydGFsLTIwMjY=}
      JWT_EXPIRATION_MINUTES: 120
      DEMO_SCHEDULE_ENABLED: ${DEMO_SCHEDULE_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 35s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  mysql_data:
