spring.application.name=digital-movie-ticket-portal
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movie_portal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:movie_app}
spring.datasource.password=${DB_PASSWORD:movie_app_dev_only}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:bXktZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1mb3ItbW92aWUtcG9ydGFsLTIwMjY=}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health
app.demo-schedule.enabled=${DEMO_SCHEDULE_ENABLED:true}
